name: Firmware builds

on:
  push:
    branches:
      - master
      - feature/refactor_to_zephyr_based
    paths:
      - 'dirty_jtag/**'
      - 'host/**'
      - 'scripts/**'
      - 'tests/**'
      - 'west.yml'
      - '.github/workflows/firmware-builds.yml'
  pull_request:
    paths:
      - 'dirty_jtag/**'
      - 'host/**'
      - 'scripts/**'
      - 'tests/**'
      - 'west.yml'
      - '.github/workflows/firmware-builds.yml'

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run native tests
        run: ./scripts/test-native.sh
      - name: Run Zephyr-facing syntax checks
        run: ./scripts/check-zephyr-syntax.sh

  zephyr:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: dirty_jtag
          toolchains: arm-zephyr-eabi
      - name: Build Raspberry Pi Pico RP2040
        run: west build dirty_jtag -p always -b rpi_pico/rp2040 -d build-rpi-pico
      - name: Build DirtyJTAG Blue Pill
        run: west build dirty_jtag -p always -b dirtyjtag_bluepill/stm32f103xb -d build-bluepill -- -DEXTRA_CONF_FILE=legacy.conf
      - name: Build Olimex STM32-H103
        run: west build dirty_jtag -p always -b olimex_stm32_h103/stm32f103xb -d build-olimex-stm32h103 -- -DEXTRA_CONF_FILE=legacy.conf
      - name: Build STM32 minimum dev board
        run: west build dirty_jtag -p always -b stm32_min_dev/stm32f103xb -d build-stm32-min-dev -- -DEXTRA_CONF_FILE=legacy.conf
